<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="img" aria-label="divider">
<defs><linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b7285" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b7285" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="5" width="1000" height="1.5" rx="0.75" fill="url(#dv)" opacity="0.5"/>
<circle cx="0" cy="5.75" r="3.5" fill="#0b7285">
      <animate attributeName="cx" values="0;1000;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/></circle>
</svg>