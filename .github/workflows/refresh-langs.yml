name: Refresh language card
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 gen_langs.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs-*.svg langs_cache.json
          git diff --staged --quiet || git commit -m "chore: refresh language card"
          git push
